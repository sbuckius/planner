
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#2b0a1a;
  --card:#3d0f25;
  --ink:#ffe4ec;
  --ink2:#f8a1c4;
  --ink3:#d4729a;
  --rule:#5a1a3a;
  --accent:#ff2d95;
  --accent-light:rgba(255,45,149,0.15);
  --success:#ff6f91;
  --success-light:rgba(255,111,145,0.15);
  --warn:#ff4081;
  --warn-light:rgba(255,64,129,0.15);
  --shadow:0 2px 16px rgba(0,0,0,0.4);
  --danger:rgba(255,45,45,0.15);
  --danger-ink:#ff6b6b;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);background-image:linear-gradient(135deg,#2b0a1a,#5a0f2e,#8b1e3f);background-attachment:fixed;color:var(--ink);min-height:100vh;padding:40px 20px 80px}
.container{max-width:860px;margin:0 auto}

.screen{display:none}
.screen.active{display:block}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px}
.lock-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:2rem;width:100%;max-width:380px;display:flex;flex-direction:column;gap:1rem;box-shadow:var(--shadow)}
.lock-icon{text-align:center;font-size:2rem;color:var(--accent)}
.lock-title{font-family:'DM Serif Display',serif;font-size:1.8rem;font-weight:400;color:var(--ink);text-align:center;line-height:1.1}
.lock-sub{font-size:13px;color:var(--ink3);text-align:center;letter-spacing:0.03em}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:500}
input[type=text],input[type=date],input[type=password],select{font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;color:var(--ink);width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--ink3)}
select option{background:#3d0f25;color:var(--ink)}

.btn-primary{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 20px;cursor:pointer;white-space:nowrap;height:38px;width:100%;transition:opacity .15s,transform .1s;letter-spacing:.02em}
.btn-primary:hover{opacity:.85}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;background:transparent;color:var(--ink2);border:1px solid var(--rule);border-radius:8px;padding:0 16px;cursor:pointer;white-space:nowrap;height:38px;transition:all .15s;letter-spacing:.02em}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon{font-family:'DM Sans',sans-serif;font-size:13px;background:transparent;color:var(--ink3);border:1px solid var(--rule);border-radius:8px;padding:0 12px;cursor:pointer;height:38px;transition:all .15s}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}

.err{font-size:12px;color:var(--danger-ink);background:var(--danger);border-radius:6px;padding:7px 10px;display:none}
.err.show{display:block}

header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px;padding-bottom:24px;border-bottom:1.5px solid var(--accent);flex-wrap:wrap;gap:1rem}
.header-left h1{font-family:'DM Serif Display',serif;font-size:3rem;font-weight:400;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.header-left p{font-size:13px;color:var(--ink3);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:1.5rem}
.stats{display:flex;gap:24px;text-align:right}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-num{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1;color:var(--ink)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.hdr-btns{display:flex;gap:6px}

.add-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.add-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:14px}
.add-row{display:grid;grid-template-columns:1fr 1fr auto auto auto;gap:10px;align-items:end}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}

.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cat-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:var(--accent-light);color:var(--ink2);border:1px solid rgba(255,45,149,.25);border-radius:999px;padding:4px 10px 4px 12px}
.chip-del{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:13px;line-height:1;padding:0;display:flex;align-items:center;transition:color .15s}
.chip-del:hover{color:var(--danger-ink)}

.cat-filter{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:var(--card);color:var(--ink2);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;cursor:pointer;transition:all .15s;letter-spacing:.03em}
.filter-btn:hover{border-color:var(--ink2)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.section{margin-bottom:28px}
.section-header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.section-left{display:flex;align-items:baseline;gap:10px}
.section-name{font-family:'DM Serif Display',serif;font-size:1.3rem;font-weight:400;color:var(--ink)}
.section-count{font-size:12px;color:var(--ink3);letter-spacing:.04em}
.del-cat-btn{font-family:'DM Sans',sans-serif;font-size:11px;background:none;border:1px solid transparent;color:var(--ink3);cursor:pointer;padding:3px 8px;border-radius:6px;transition:all .15s;letter-spacing:.03em}
.del-cat-btn:hover{background:var(--danger);color:var(--danger-ink)}

.task-list{display:flex;flex-direction:column;gap:2px}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--rule);border-radius:8px;transition:box-shadow .15s}
.task-row:hover{box-shadow:var(--shadow)}
.task-row.done{opacity:.45}
.task-row.editing{border-color:var(--accent);opacity:1}
.task-check{width:17px;height:17px;margin-top:2px;flex-shrink:0;cursor:pointer;accent-color:var(--accent)}
.task-body{flex:1;min-width:0}
.task-name{font-size:14px;color:var(--ink);line-height:1.4}
.task-row.done .task-name{text-decoration:line-through}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.task-sub{font-size:12px;color:var(--ink3);font-style:italic}
.task-date{font-size:11px;color:var(--ink3);letter-spacing:.03em}
.badge{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.badge-ok{background:var(--success-light);color:var(--success)}
.badge-soon{background:var(--warn-light);color:var(--warn)}
.badge-overdue{background:var(--accent-light);color:var(--accent)}
.task-actions{display:flex;gap:4px;flex-shrink:0;margin-top:1px}
.edit-btn{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid transparent;color:var(--ink3);cursor:pointer;padding:3px 8px;border-radius:6px;transition:all .15s}
.edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.del-btn{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid transparent;color:var(--ink3);cursor:pointer;padding:3px 8px;border-radius:6px;flex-shrink:0;transition:all .15s}
.del-btn:hover{background:var(--danger);color:var(--danger-ink)}

.edit-form{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end;width:100%;margin-top:2px}
.edit-form input[type=text],.edit-form input[type=date],.edit-form select{font-size:13px;padding:6px 10px;height:32px}
.save-btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:0 12px;cursor:pointer;height:32px;white-space:nowrap;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.cancel-btn{font-family:'DM Sans',sans-serif;font-size:12px;background:none;color:var(--ink3);border:1px solid var(--rule);border-radius:6px;padding:0 10px;cursor:pointer;height:32px;transition:all .15s}
.cancel-btn:hover{border-color:var(--ink2);color:var(--ink2)}

.empty-state{text-align:center;padding:40px;color:var(--ink3);font-size:14px;font-style:italic}
.empty-cat{font-size:13px;color:var(--ink3);font-style:italic;padding:10px 14px}
.sync-note{font-size:12px;color:var(--ink3);margin-bottom:16px;letter-spacing:.02em}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1.5rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:1rem;box-shadow:var(--shadow)}
.modal-title{font-family:'DM Serif Display',serif;font-size:1.4rem;font-weight:400;color:var(--ink)}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn-primary{width:auto;flex:1}
</style>

<!-- Setup screen -->
<div id="setupScreen" class="screen active">
  <div class="container">
    <div class="center">
      <div class="lock-card">
        <div class="lock-icon">✦</div>
        <div class="lock-title">Create a password</div>
        <div class="lock-sub">You only need to do this once. Choose a password to protect your tasks.</div>
        <div class="field"><label>Password</label><input type="password" id="setupPwd" placeholder="Min 4 characters" /></div>
        <div class="field"><label>Confirm password</label><input type="password" id="setupPwd2" placeholder="Repeat password" onkeydown="if(event.key==='Enter')setupPassword()" /></div>
        <div class="err" id="setupErr"></div>
        <button class="btn-primary" onclick="setupPassword()">Set password &amp; continue</button>
      </div>
    </div>
  </div>
</div>

<!-- Login screen -->
<div id="loginScreen" class="screen">
  <div class="container">
    <div class="center">
      <div class="lock-card">
        <div class="lock-icon">✦</div>
        <div class="lock-title">Task Planner</div>
        <div class="lock-sub">Enter your password to unlock</div>
        <div class="field"><label>Password</label><input type="password" id="loginPwd" placeholder="Your password" onkeydown="if(event.key==='Enter')login()" /></div>
        <div class="err" id="loginErr"></div>
        <button class="btn-primary" onclick="login()">Unlock</button>
      </div>
    </div>
  </div>
</div>

<!-- Main app -->
<div id="appScreen" class="screen">
  <div class="container">
    <header>
      <div class="header-left">
        <h1>Task Planner</h1>
        <p>Your personal organiser</p>
      </div>
      <div class="header-right">
        <div class="stats">
          <div class="stat-item"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Total</span></div>
          <div class="stat-item"><span class="stat-num" id="statDone">0</span><span class="stat-label">Done</span></div>
          <div class="stat-item"><span class="stat-num" id="statOverdue">0</span><span class="stat-label">Overdue</span></div>
        </div>
        <div class="hdr-btns">
          <button class="btn-icon" onclick="showChangePwd()" title="Change password">🔑</button>
          <button class="btn-icon" onclick="lockApp()" title="Lock">🔒</button>
        </div>
      </div>
    </header>

    <div class="add-card">
      <div class="add-title">Add a new task</div>
      <div class="add-row">
        <div class="field"><label>Task</label><input type="text" id="tTask" placeholder="What needs doing?" /></div>
        <div class="field"><label>Note</label><input type="text" id="tSub" placeholder="Optional note" /></div>
        <div class="field"><label>Due date</label><input type="date" id="tDate" /></div>
        <div class="field"><label>Category</label><select id="tCat"></select></div>
        <button class="btn-primary" onclick="addTask()">Add task</button>
      </div>
      <div class="cat-row">
        <div class="field"><label>New category</label><input type="text" id="newCatInput" placeholder="e.g. Finance, Travel, Work…" /></div>
        <button class="btn-ghost" onclick="addCategory()">+ Add category</button>
      </div>
      <div class="cat-chips" id="catChips"></div>
    </div>

    <div class="sync-note" id="syncNote">Connecting…</div>
    <div class="cat-filter" id="filterRow"></div>
    <div id="board"></div>
  </div>
</div>

<!-- Change password modal -->
<div class="modal-bg" id="changePwdModal">
  <div class="modal">
    <div class="modal-title">Change password</div>
    <div class="field"><label>Current password</label><input type="password" id="cpCurrent" placeholder="Current password" /></div>
    <div class="field"><label>New password</label><input type="password" id="cpNew" placeholder="Min 4 characters" /></div>
    <div class="field"><label>Confirm new</label><input type="password" id="cpConfirm" placeholder="Repeat new password" /></div>
    <div class="err" id="cpErr"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="changePassword()">Update password</button>
      <button class="btn-ghost" onclick="closeChangePwd()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
<script>
const FB_API_KEY = 'AIzaSyDB52HLaYVqIF010_4ztthPowCaP9AKres';
const FB_PROJECT = 'collaborative-writing-poem';
const BASE_URL = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents`;

let tasks = [];
let cats = ['Teaching','Artwork','Family','Health'];
let activeFilter = 'All';
let editingId = null;

function hashPwd(p){ return sha256(p+'tp_taskplanner_2024'); }
function showErr(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }
function hideErr(id){ document.getElementById(id).classList.remove('show'); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function setSyncNote(msg){ const el=document.getElementById('syncNote'); if(el) el.textContent=msg; }

function encodeFields(obj){
  const f={};
  for(const [k,v] of Object.entries(obj)){
    if(typeof v==='string') f[k]={stringValue:v};
    else if(typeof v==='boolean') f[k]={booleanValue:v};
    else if(typeof v==='number') f[k]={integerValue:String(v)};
    else f[k]={stringValue:JSON.stringify(v)};
  }
  return f;
}

function decodeFields(fields){
  const obj={};
  for(const [k,f] of Object.entries(fields)){
    if('stringValue' in f){ try{ obj[k]=JSON.parse(f.stringValue); }catch{ obj[k]=f.stringValue; } }
    else if('booleanValue' in f) obj[k]=f.booleanValue;
    else if('integerValue' in f) obj[k]=parseInt(f.integerValue);
  }
  return obj;
}

async function fsGet(col,doc){
  const r=await fetch(`${BASE_URL}/${col}/${doc}?key=${FB_API_KEY}`);
  if(r.status===404) return null;
  if(!r.ok) throw new Error('Firestore error '+r.status);
  const j=await r.json();
  return decodeFields(j.fields||{});
}

async function fsSet(col,doc,data){
  const r=await fetch(`${BASE_URL}/${col}/${doc}?key=${FB_API_KEY}`,{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fields:encodeFields(data)})
  });
  if(!r.ok) throw new Error('Firestore write error '+r.status);
}

async function setupPassword(){
  hideErr('setupErr');
  const p=document.getElementById('setupPwd').value;
  const p2=document.getElementById('setupPwd2').value;
  if(p.length<4){ showErr('setupErr','Password must be at least 4 characters.'); return; }
  if(p!==p2){ showErr('setupErr','Passwords do not match.'); return; }
  try{
    await fsSet('tp_config','auth',{passwordHash:hashPwd(p)});
    await loadAppData();
    showScreen('appScreen');
    toast('Password set — you\'re in!');
  } catch(e){ showErr('setupErr','Could not connect to Firebase: '+(e.message||e)); }
}

async function login(){
  hideErr('loginErr');
  const p=document.getElementById('loginPwd').value;
  if(!p){ showErr('loginErr','Enter your password.'); return; }
  try{
    const auth=await fsGet('tp_config','auth');
    if(!auth||!auth.passwordHash){ showErr('loginErr','No password found.'); return; }
    if(auth.passwordHash!==hashPwd(p)){ showErr('loginErr','Incorrect password.'); return; }
    document.getElementById('loginPwd').value='';
    await loadAppData();
    showScreen('appScreen');
  } catch(e){ showErr('loginErr','Connection error: '+(e.message||e)); }
}

function lockApp(){ showScreen('loginScreen'); }

function showChangePwd(){ document.getElementById('changePwdModal').classList.add('show'); }
function closeChangePwd(){
  document.getElementById('changePwdModal').classList.remove('show');
  hideErr('cpErr');
  ['cpCurrent','cpNew','cpConfirm'].forEach(id=>document.getElementById(id).value='');
}

async function changePassword(){
  hideErr('cpErr');
  const cur=document.getElementById('cpCurrent').value;
  const np=document.getElementById('cpNew').value;
  const nc=document.getElementById('cpConfirm').value;
  if(!cur||!np||!nc){ showErr('cpErr','Fill in all fields.'); return; }
  if(np.length<4){ showErr('cpErr','New password must be at least 4 characters.'); return; }
  if(np!==nc){ showErr('cpErr','New passwords do not match.'); return; }
  try{
    const auth=await fsGet('tp_config','auth');
    if(auth.passwordHash!==hashPwd(cur)){ showErr('cpErr','Current password is wrong.'); return; }
    await fsSet('tp_config','auth',{passwordHash:hashPwd(np)});
    closeChangePwd();
    toast('Password updated.');
  } catch(e){ showErr('cpErr','Error: '+(e.message||e)); }
}

async function loadAppData(){
  setSyncNote('Loading…');
  try{
    const data=await fsGet('tp_planner','data');
    if(data&&Array.isArray(data.tasks)) tasks=data.tasks;
    if(data&&Array.isArray(data.cats)) cats=data.cats;
    setSyncNote('Synced · '+new Date().toLocaleTimeString());
  } catch(e){ setSyncNote('Load error — check connection'); }
  render();
}

async function saveData(){
  setSyncNote('Saving…');
  try{
    await fsSet('tp_planner','data',{tasks:JSON.stringify(tasks),cats:JSON.stringify(cats)});
    setSyncNote('Saved · '+new Date().toLocaleTimeString());
  } catch(e){ setSyncNote('Save failed'); }
}

function addCategory(){
  const val=document.getElementById('newCatInput').value.trim();
  if(!val){ toast('Enter a category name.'); return; }
  if(cats.map(c=>c.toLowerCase()).includes(val.toLowerCase())){ toast('Category already exists.'); return; }
  cats.push(val);
  document.getElementById('newCatInput').value='';
  saveData(); render(); toast('"'+val+'" added.');
}

function deleteCategory(cat){
  const n=tasks.filter(t=>t.cat===cat).length;
  const msg=n>0?'Delete "'+cat+'" and its '+n+' task'+(n>1?'s':'')+' ?':'Delete category "'+cat+'"?';
  if(!confirm(msg)) return;
  cats=cats.filter(c=>c!==cat);
  tasks=tasks.filter(t=>t.cat!==cat);
  if(activeFilter===cat) activeFilter='All';
  if(editingId!==null&&!tasks.find(x=>x.id===editingId)) editingId=null;
  saveData(); render(); toast('"'+cat+'" deleted.');
}

function addTask(){
  const name=document.getElementById('tTask').value.trim();
  const sub=document.getElementById('tSub').value.trim();
  const date=document.getElementById('tDate').value;
  const cat=document.getElementById('tCat').value;
  if(!cats.length){ toast('Add a category first.'); return; }
  if(!name){ toast('Please enter a task name.'); return; }
  if(!date){ toast('Please pick a due date.'); return; }
  tasks.push({id:Date.now(),name,sub,date,cat,done:false});
  document.getElementById('tTask').value='';
  document.getElementById('tSub').value='';
  saveData(); render(); toast('Task added.');
}

function toggleTask(id){
  const t=tasks.find(x=>x.id===id);
  if(t){ t.done=!t.done; saveData(); render(); }
}

function deleteTask(id){
  tasks=tasks.filter(x=>x.id!==id);
  if(editingId===id) editingId=null;
  saveData(); render(); toast('Task removed.');
}

function startEdit(id){ editingId=id; render(); const inp=document.getElementById('en-'+id); if(inp){inp.focus();inp.select();} }
function cancelEdit(){ editingId=null; render(); }

function saveEdit(id){
  const ne=document.getElementById('en-'+id);
  const se=document.getElementById('es-'+id);
  const de=document.getElementById('ed-'+id);
  const ce=document.getElementById('ec-'+id);
  const name=ne.value.trim(), date=de.value;
  if(!name){ toast('Task name cannot be empty.'); ne.focus(); return; }
  if(!date){ toast('Please pick a due date.'); de.focus(); return; }
  const t=tasks.find(x=>x.id===id);
  if(t){t.name=name;t.sub=se.value.trim();t.date=date;t.cat=ce.value;}
  editingId=null; saveData(); render(); toast('Task updated.');
}

function daysUntil(ds){
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((new Date(ds+'T00:00:00')-now)/86400000);
}

function badgeHTML(d,done){
  if(done) return '';
  if(d<0) return '<span class="badge badge-overdue">Overdue</span>';
  if(d<=3) return '<span class="badge badge-soon">Due soon</span>';
  return '<span class="badge badge-ok">On track</span>';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setFilter(f){ activeFilter=f; render(); }

function render(){
  document.getElementById('statTotal').textContent=tasks.length;
  document.getElementById('statDone').textContent=tasks.filter(t=>t.done).length;
  document.getElementById('statOverdue').textContent=tasks.filter(t=>!t.done&&daysUntil(t.date)<0).length;

  const sel=document.getElementById('tCat');
  const cur=sel.value;
  sel.innerHTML=cats.map(c=>'<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>').join('');

  document.getElementById('catChips').innerHTML=cats.map(c=>
    '<span class="cat-chip">'+esc(c)+'<button class="chip-del" onclick="deleteCategory(\''+c.replace(/'/g,"\\'")+'\')">&#x2715;</button></span>'
  ).join('');

  document.getElementById('filterRow').innerHTML=['All',...cats].map(f=>
    '<button class="filter-btn'+(activeFilter===f?' active':'')+'" onclick="setFilter(\''+f.replace(/'/g,"\\'")+'\')">'+esc(f)+'</button>'
  ).join('');

  const show=activeFilter==='All'?cats:[activeFilter];
  let html='';
  show.forEach(cat=>{
    const list=tasks.filter(t=>t.cat===cat).sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      return new Date(a.date)-new Date(b.date);
    });
    const pending=list.filter(t=>!t.done).length;
    html+='<div class="section"><div class="section-header"><div class="section-left"><span class="section-name">'+esc(cat)+'</span><span class="section-count">'+pending+' pending &middot; '+(list.length-pending)+' done</span></div><button class="del-cat-btn" onclick="deleteCategory(\''+cat.replace(/'/g,"\\'")+'\')">Delete category</button></div><div class="task-list">';
    if(!list.length){
      html+='<div class="empty-cat">No tasks yet in this category.</div>';
    } else {
      list.forEach(t=>{
        const d=daysUntil(t.date);
        if(editingId===t.id){
          const catOpts=cats.map(c=>'<option value="'+esc(c)+'"'+(c===t.cat?' selected':'')+'>'+esc(c)+'</option>').join('');
          html+='<div class="task-row editing"><input type="checkbox" class="task-check"'+(t.done?' checked':'')+' onchange="toggleTask('+t.id+')" />';
          html+='<div class="task-body"><div class="edit-form">';
          html+='<input type="text" id="en-'+t.id+'" value="'+esc(t.name)+'" placeholder="Task name" onkeydown="if(event.key===\'Enter\')saveEdit('+t.id+');if(event.key===\'Escape\')cancelEdit();" />';
          html+='<input type="text" id="es-'+t.id+'" value="'+esc(t.sub||'')+'" placeholder="Note (optional)" />';
          html+='<input type="date" id="ed-'+t.id+'" value="'+esc(t.date)+'" />';
          html+='<select id="ec-'+t.id+'">'+catOpts+'</select>';
          html+='</div><div style="display:flex;gap:6px;margin-top:8px;"><button class="save-btn" onclick="saveEdit('+t.id+')">Save</button><button class="cancel-btn" onclick="cancelEdit()">Cancel</button></div></div></div>';
        } else {
          html+='<div class="task-row'+(t.done?' done':'')+'"><input type="checkbox" class="task-check"'+(t.done?' checked':'')+' onchange="toggleTask('+t.id+')" />';
          html+='<div class="task-body"><div class="task-name">'+esc(t.name)+'</div>';
          html+='<div class="task-meta">'+(t.sub?'<span class="task-sub">'+esc(t.sub)+'</span>':'')+
            '<span class="task-date">'+esc(t.date)+'</span>'+badgeHTML(d,t.done)+'</div></div>';
          html+='<div class="task-actions"><button class="edit-btn" onclick="startEdit('+t.id+')">Edit</button><button class="del-btn" onclick="deleteTask('+t.id+')">Remove</button></div></div>';
        }
      });
    }
    html+='</div></div>';
  });
  if(!html) html='<div class="empty-state">No tasks here yet — add one above.</div>';
  document.getElementById('board').innerHTML=html;
}

document.getElementById('tTask').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
document.getElementById('newCatInput').addEventListener('keydown',e=>{if(e.key==='Enter')addCategory();});

(async()=>{
  try{
    const auth=await fsGet('tp_config','auth');
    if(auth&&auth.passwordHash){ showScreen('loginScreen'); }
    else { showScreen('setupScreen'); }
  } catch(e){ showScreen('setupScreen'); }
})();
</script>
